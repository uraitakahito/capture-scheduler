# wmill CLI の設定。`wmill sync push` / `pull` がこれを読む。
#
# **`includeSchedules: true` を残す。** この repo に schedule は無い (定期実行の時計は capture-ledger の中)。
# 同期の対象から外すと、UI で作った schedule や、前に push した schedule が Windmill に残っていても
# push が消さない。doctor の `schedule` の点検と 2 つで、残らないようにしている。
defaultTs: bun
includes:
  - f/**
excludes: []
codebases: []
includeSchedules: true
includeTriggers: false
includeUsers: false
includeGroups: false
includeSettings: false
# 変数は同期しない。**秘密が git に落ちるため。**
# `u/admin/waggle_token` は scripts/capture-ledger-token.mjs が API 経由で入れる。
includeKey: false
skipVariables: true
skipResources: true
skipResourceTypes: true
skipSecrets: true
