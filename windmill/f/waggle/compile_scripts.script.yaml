summary: TS を型検査して JS にする (ts-compile-service)
description: |
  クロール 1 段を回す flow (f/waggle/crawl_level) の部品。plan と hosts の間。
  単体で叩くものではない。

  台帳が送った TS の目録を ts-compile-service に POST し、JS の目録を受け取る。
  型が通らなければ 422 で、ここで投げる —— flow は failure_module へ落ち、クロールは failed になる。
lock: '!inline f/waggle/compile_scripts.script.lock'
kind: script
schema:
  properties:
    scripts:
      type: array
      description: ''
      default: null
      format: resource-crawl_script
      items:
        type: object
        properties:
          id:
            type: string
            description: ''
            originalType: string
          version:
            type: number
            description: ''
          options:
            type: object
            description: ''
            format: resource-record
          phase:
            type: string
            description: ''
            enum:
              - preload
              - behavior
            originalType: enum
          sha256:
            type: string
            description: ''
            originalType: string
          source:
            type: string
            description: ''
            originalType: string
      originalType: record[]
  required:
    - scripts
