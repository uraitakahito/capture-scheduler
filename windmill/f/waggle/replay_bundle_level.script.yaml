summary: クロールの合本を capture-ledger に書かせる
description: |
  クロール 1 段を回す flow (f/waggle/crawl_level) の部品。report と index の間。
  単体で叩くものではない。

  合本は、そのクロールの WACZ を全部並べた replay.json と、その頁の行の pages.json の組。
  capture-ledger が段ごとに新しい版として保管庫に書き、replay はそれを 1 つのアーカイブとして開く。

  capture-ledger が 200 で返す失敗 (保管庫に書けない・検められない WACZ・入れる WACZ がまだ無い) では投げない ——
  投げると索引の段が飛び、クロールが failed で締められる。投げるのは 200 で答えなかったときと、
  答えの形が違うときだけ。
lock: "!inline f/waggle/replay_bundle_level.script.lock"
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    crawl_id:
      type: string
      description: ""
      default: null
      originalType: string
    depth:
      type: number
      description: ""
      default: null
  required:
    - crawl_id
    - depth
