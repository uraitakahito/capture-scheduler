summary: 落ちた段を capture-ledger に伝えてクロールを締める
description: |
  クロール 1 段を回す flow (f/waggle/crawl_level) の failure_module。
  普通の段としては走らない。

  flow が途中で落ちると report_level に辿り着かないので、capture-ledger は何も知らされず
  crawls の行が running のまま残る。部分 unique index が以後のクロールを全部塞ぐので、
  ここで締める。

  締められなくても throw しない。flow はどのみち既に失敗していて、その赤が履歴に残る。
lock: "!inline f/waggle/fail_crawl.script.lock"
kind: script
schema:
  properties:
    crawl_id:
      type: string
      description: ""
      default: null
      originalType: string
    depth:
      type: number
      description: ""
      default: null
    level_key:
      type: string
      description: ""
      default: null
      originalType: string
    error:
      description: Windmill が渡す誤りの中身
      default: null
  required:
    - crawl_id
    - depth
    - level_key
    - error
