summary: capture-ledger に取り込みを 1 回起こす
description: |
  capture-ledger の POST /api/crawls を fromTargets で叩き、終わるまで見届ける。

  capture_targets の有効な行がそのまま起点になる。深さは capture-ledger が 0 にするので
  リンクは辿らない —— 以前の POST /api/runs と同じことを、クロールの語彙でやる。

  走行中なら 409 が返るので、そのときは何もせず緑で終わる (再試行しない)。
  手で起こしたクロールとも塞ぎ合う (礼儀の観点ではそれが正しい)。

  取り込む形式 (wacz など) は capture-ledger 側の CAPTURE_LEDGER_CAPTURE_FORMATS が決める。
  ここから渡せるのは limit だけ。
lock: "!inline f/waggle/trigger_crawl.script.lock"
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - waggle_url
    - token
    - limit
    - timeout_ms
  properties:
    limit:
      type: number
      description: 起点にする対象の上限。省くと enabled な行を全部
      default: null
      minimum: 1
    poll_interval_ms:
      type: number
      description: ""
      default: null
    timeout_ms:
      type: number
      description: 見届けを諦めるまで。既定は 2 時間
      default: null
    token:
      type: string
      description: capture-ledger の dev issuer が出した JWT
      default: null
      format: password
      originalType: string
    waggle_url:
      type: string
      description: コンテナから見た capture-api の URL
      default: null
      originalType: string
  required:
    - waggle_url
    - token
