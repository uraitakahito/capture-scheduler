summary: クロール 1 段
description: |
  capture-ledger が投げた 1 段を処理して報告する。

  この flow は **1 段で終わる**。次の段を起こすのは capture-ledger —— Windmill の while ループに
  繰り返しを持たせようとしたが、stop_after_if を付けた最小の flow が 643 回まで回り続けた
  (実測)。相手のサーバに負荷をかけない仕組みを、暴走しうるループの上には載せない。

  礼儀はこの flow の形で守る:
    - ホストで束ねる            (plan_level)
    - ホストを並列に回す        for-loop の parallelism —— CE で効く唯一の同時実行の枠
                                (上限は BrowserHive のエンドポイントの数。plan_level が決める)
    - ホスト内は逐次 + 間隔     (crawl_host)

  報告のあとに 2 段足してある。合本を書かせる段 (replay_bundle) と、索引に載せる段 (index)。
  合本は、そのクロールの WACZ を全部並べた replay.json と頁の行の pages.json の組で、replay が
  1 つのアーカイブとして開く。合本を先に置くのは、合本が OpenSearch に頼らないから —— 索引が
  落ちても合本は書かれる。合本の段は、capture-ledger が 200 で返す失敗 (保管庫に書けない など) では投げない。
  投げると索引の段が飛び、クロールが failed で締められる。何を入れ・何を載せるかを選ぶのは
  capture-ledger で、ここが渡すのは crawl_id と段の深さだけ —— 判断を、単体試験の無い場所に置かないため。

  Windmill の per-key concurrency limit は使わない。実装が jobs_ee.rs にあり、
  Community Edition では常に許可を返すスタブなので、**設定しても無言で素通しになる**。
value:
  modules:
    - id: plan
      summary: ホストで束ね、robots を見る
      value:
        type: script
        path: f/waggle/plan_level
        input_transforms:
          candidates:
            type: javascript
            expr: flow_input.frontier
          per_host_delay_ms:
            type: javascript
            expr: flow_input.per_host_delay_ms
          respect_robots:
            type: javascript
            expr: flow_input.respect_robots
          host_parallelism:
            type: javascript
            expr: flow_input.host_parallelism
          # 字に BrowserHive があれば、robots をその名前で照らす
          user_agent:
            type: javascript
            expr: flow_input.user_agent
    # **TS のスクリプトを JS にする。** capture-ledger が持つのは書いたままの TS (sha256 は TS のバイト列)。
    # BrowserHive が評価するのは JS (sha256 は JS のバイト列)。その継ぎ目がこの段で、
    # 変換するのは ts-compile-service —— 型が通らなければ 422 でこの段が落ち、failure_module が
    # クロールを failed で締める。通らない TS を黙って走らせない。
    - id: compile
      summary: TS を型検査して JS に (ts-compile-service)。通らなければ段ごと落ちる
      value:
        type: script
        path: f/waggle/compile_scripts
        input_transforms:
          scripts:
            type: javascript
            expr: flow_input.scripts
          # 必須の変数が渡されているかを見るのに、名前だけを送る (値は送らない)
          variables:
            type: javascript
            expr: flow_input.variables
    - id: hosts
      summary: ホストごとに並列、ホスト内は逐次
      value:
        type: forloopflow
        modules:
          - id: cap
            value:
              type: script
              path: f/waggle/crawl_host
              input_transforms:
                crawl_id:
                  type: javascript
                  expr: flow_input.crawl_id
                host:
                  type: javascript
                  expr: flow_input.iter.value.host
                urls:
                  type: javascript
                  expr: flow_input.iter.value.urls
                per_host_delay_ms:
                  type: javascript
                  expr: flow_input.iter.value.delayMs
                initial_delay_ms:
                  type: javascript
                  expr: flow_input.iter.value.initialDelayMs
                capture_formats:
                  type: javascript
                  expr: flow_input.capture_formats
                signing:
                  type: javascript
                  expr: flow_input.signing
                # compile の段が返した、JS にしたスクリプト。flow_input.scripts (TS) を直接渡さない ——
                # 渡すと BrowserHive はページの中で TS を評価しようとして失敗する (試験が赤くなる)。
                scripts:
                  type: javascript
                  expr: results.compile.scripts
                artifact_sink:
                  type: javascript
                  expr: flow_input.artifact_sink
                # クロールごとの値。**flow は運ぶだけで中身を見ない。** variables は名前 → 値で、
                # BrowserHive が記録に残す。secrets は名前 → Windmill の変数の path で、値に解くのは
                # crawl_host (f/waggle_secrets/ の下だけ)。secret_archive は値を WARC に残すシークレットの
                # 名前 → "keep" で、crawl_host が解いた名前だけを BrowserHive の secretArchive にする。ここを
                # 書き忘れると null で届き、keep の値も隠れる (残すつもりの値が黙って消える側に倒れる)。
                # 古い capture-ledger はどれも送らないので null で届き、crawl_host が「無い」と読む。
                variables:
                  type: javascript
                  expr: flow_input.variables
                secrets:
                  type: javascript
                  expr: flow_input.secrets
                secret_archive:
                  type: javascript
                  expr: flow_input.secret_archive
                # 頼まれた User-Agent。**flow は運ぶだけで解かない** ({chrome} を解くのは BrowserHive)。
                # capture-ledger は必ず文字列を送る (指定なしは "")。ここを書き忘れると null で届き、crawl_host が投げる。
                user_agent:
                  type: javascript
                  expr: flow_input.user_agent
            # crawl_host が投げたら、再起動を待つぶんの間隔で 2 回再試行する (初回と合わせて計 3 回)。
            # 再試行はホストを 1 件目から撮り直す。だから crawl_host が投げるのは、まだ何も撮っていないとき
            # だけ —— ホストの 1 件目で BrowserHive が全部居ない (ServerUnavailable) か、引数が欠けたか、
            # 変数・シークレット・エンドポイントの一覧が読めないとき。1 ページの失敗と、撮った後に居なくなったときは結果に載せる。
            retry:
              constant:
                attempts: 2
                seconds: 30
        iterator:
          type: javascript
          expr: results.plan.groups
        parallel: true
        # host_parallelism を BrowserHive のエンドポイントの数で頭打ちにした値。判断は plan_level に
        # 置き、ここには式を書かない (単体試験の無い場所に判断を置かない)。
        parallelism:
          type: javascript
          expr: results.plan.parallelism
        skip_failures: false
    - id: report
      summary: capture-ledger に報告する
      value:
        type: script
        path: f/waggle/report_level
        input_transforms:
          crawl_id:
            type: javascript
            expr: flow_input.crawl_id
          depth:
            type: javascript
            expr: flow_input.depth
          results:
            type: javascript
            expr: |-
              results.hosts.flat().concat(
                results.plan.skipped.map((s) => ({ url: s.url, status: "skipped", skipReason: s.reason }))
              )
          # compile の段の出力そのもの。JS の sha256 と、何で・何に向けて変換したか。
          # report_level が身元と hash だけに削って capture-ledger へ運ぶ
          compiled:
            type: javascript
            expr: results.compile
    # **合本を書かせる。** 報告の後なので、この段で capture-ledger に載った WACZ も入る。index より前に置くのは、
    # 合本が OpenSearch に頼らないから。capture-ledger が 200 で返す失敗では投げない (replay_bundle_level.ts) ——
    # ここで投げると index が飛び、failure_module がクロールを failed で締める。depth は capture-ledger が
    # replay.json に記録するだけで、版は capture-ledger が払い出す。
    - id: replay_bundle
      summary: 合本を書かせる (replay で 1 つのアーカイブとして開ける形)
      value:
        type: script
        path: f/waggle/replay_bundle_level
        input_transforms:
          crawl_id:
            type: javascript
            expr: flow_input.crawl_id
          depth:
            type: javascript
            expr: flow_input.depth
    - id: index
      summary: 索引に載せる
      value:
        type: script
        path: f/waggle/index_level
        input_transforms:
          crawl_id:
            type: javascript
            expr: flow_input.crawl_id
  # **段が落ちたときに走る。** flow が途中で死ぬと report まで辿り着かないので、
  # capture-ledger は何も知らされず `crawls` の行が `running` のまま残る —— 部分 unique index が
  # 以後のクロールを全部塞ぐ。実測で踏んだ (BrowserHive を止めたクロールが永久に走行中)。
  #
  # `error` は Windmill が failure_module にだけ渡す特別な入力。
  failure_module:
    id: failure
    value:
      type: script
      path: f/waggle/fail_crawl
      input_transforms:
        crawl_id:
          type: javascript
          expr: flow_input.crawl_id
        error:
          type: javascript
          expr: error

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - crawl_id
    - depth
    - frontier
    - per_host_delay_ms
    - host_parallelism
    - respect_robots
    - capture_formats
    - signing
  properties:
    crawl_id:
      type: string
      description: capture-ledger が発行したクロールの id
    depth:
      type: integer
      description: この段の深さ。起点が 0
      minimum: 0
    frontier:
      type: array
      description: この段で取る URL
      items:
        type: object
        properties:
          host:
            type: string
          url:
            type: string
    host_parallelism:
      type: integer
      description: 同時に触ってよいホストの数
      default: 4
    per_host_delay_ms:
      type: integer
      description: 同じホストへ、完了から次の投入まで空ける時間
      default: 2000
    respect_robots:
      type: boolean
      description: robots.txt を尊重するか
      default: true
    capture_formats:
      type: object
      description: 取り込む形式。capture-ledger が決めて必ず送る（既定値には頼れない）
      properties:
        png:
          type: boolean
        webp:
          type: boolean
        html:
          type: boolean
        links:
          type: boolean
        mhtml:
          type: boolean
        wacz:
          type: boolean
    signing:
      type: boolean
      description: WACZ に署名するか。capture-ledger が決めて必ず送る
    scripts:
      # ページの中で走らせるもの。**flow は運ぶだけで中身を見ない** —— 何を走らせるかも
      # 並びも capture-ledger が決める。BrowserHive は顔ぶれを持たないので、
      # ここが空なら本当にページの中では何も走らない。
      type: array
      description: ページの中で走らせるスクリプト。capture-ledger が解決して必ず送る
      items:
        type: object
        properties:
          id:
            type: string
          version:
            type: integer
          phase:
            type: string
          source:
            type: string
          sha256:
            type: string
          options:
            type: object
    artifact_sink:
      # 成果物の送り先。**必須にしない** —— 省けば BrowserHive は従来どおり自前の
      # 保管庫へ書くので、2 つの経路が同時に生きる。切り替えを 1 本のクロールから
      # 始められるのが、この省略可能性の狙い。
      type: object
      description: 成果物の押し出し先。capture-ledger が crawl ごとに 1 回きりの受け取り先を発行する
      properties:
        url:
          type: string
        token:
          type: string
    variables:
      # クロールごとの変数。capture-ledger がクロールの頼みから固定し、v0.67.0 から**必ず送る**
      # (無ければ {})。flow は運ぶだけで中身を見ない。BrowserHive が記録に残す。
      type: object
      description: クロールごとの変数 (名前 → 値)。スクリプトが defineParams で読む。値は記録に残る
      additionalProperties:
        type: string
    secrets:
      # クロールごとのシークレット。値ではなく **Windmill の変数の path** (f/waggle_secrets/<名前>) で
      # 届き、crawl_host が getVariable で解いて BrowserHive にだけ渡す。flow の入力にも run の履歴にも
      # 値は現れない。BrowserHive (v29.0.0 から) は値を WARC でも既定で隠す (secret_archive に在る物だけ残す)。
      type: object
      description: クロールごとのシークレット (名前 → Windmill の変数の path)。crawl_host が解き、スクリプトが __bh.secrets で読む。値は capture-ledger にも run の引数にも無く、WARC では既定で *** に置き換わる
      additionalProperties:
        type: string
    secret_archive:
      # 値を WARC に残すシークレット。capture-ledger がスクリプトの宣言 (archive: "keep") から組み、**必ず送る**
      # (無ければ {})。crawl_host は、解いたシークレットに在る名前だけを BrowserHive の secretArchive に載せる。
      type: object
      description: 値を WARC に残すシークレット (名前 → "keep")。無い名前の値は BrowserHive が *** に置き換える
      additionalProperties:
        type: string
        enum:
          - keep
    user_agent:
      # 頼まれた User-Agent。capture-ledger がクロールの頼みから固定し、**必ず送る** (指定なしは "")。
      type: string
      description: 頼まれた User-Agent。打った字のままで、{chrome} は BrowserHive が解く。空なら browser の字のまま撮る
      default: ""
  # capture-ledger が送るのは crawl_id / depth / frontier / 間隔 / 並列度 /
  # capture_formats / signing / scripts / variables / secrets / secret_archive / user_agent と、受け取り先を
  # 出している配備では artifact_sink。並列度は plan_level が BrowserHive のエンドポイントの数で頭打ちにしてから for-loop に渡る。
  # schema に無い入力を capture-ledger が送っても、Windmill は既定で引数を schema に照らさないので断らない (frontier の
  # 要素の lastFinishedAt も、ここに書いていないのに plan_level まで届いている)。
  # capture-ledger は自分がコンテナからどう見えるかを知らないし、flow の資格 (u/admin/ledger_client) も持っていない。
  #
  # **下の default は webhook からの実行では埋まらない。** 実測: 必須の引数だけ渡して
  # 起こすと、host_parallelism も respect_robots も「渡されていない」まま届く。
  # 既定値が埋まるのは UI からの実行だけ。
  #
  # つまり respect_robots は **常に null で届く**。robots を守っているのは
  # plan_level.ts の `?? true` **1 か所だけ**で、ここの default ではない。
  # 消すと robots が黙って無視される (test/plan-level.test.ts と
  # test/e2e/crawl-level.e2e.test.ts の両方が赤くなる)。
  required:
    - crawl_id
    - depth
    - frontier
    # **形式と署名とスクリプトは必須。** 既定値は webhook 起動では埋まらないので、
    # 省略できる形にすると「渡し忘れ」が黙って別の形式で走ることになる。
    # scripts を落とすと、ページの中で何も走らないまま成功したアーカイブが出る。
    - capture_formats
    - signing
    - scripts
