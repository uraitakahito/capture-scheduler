summary: 1 ホストぶんを逐次で取り込む
description: |
  クロール 1 段を回す flow (f/waggle/crawl_level) の部品。
  単体で叩くものではない。
lock: "!inline f/waggle/crawl_host.script.lock"
kind: script
schema:
  properties:
    artifact_sink:
      type: object
      description: ""
      default: null
      properties:
        token:
          type: string
          description: ""
          originalType: string
        url:
          type: string
          description: ""
          originalType: string
    capture_formats:
      type: object
      description: ""
      default: null
      properties:
        html:
          type: boolean
        links:
          type: boolean
        mhtml:
          type: boolean
        png:
          type: boolean
        wacz:
          type: boolean
        webp:
          type: boolean
    crawl_id:
      type: string
      description: ""
      default: null
      originalType: string
    host:
      type: string
      description: ""
      default: null
      originalType: string
    initial_delay_ms:
      type: integer
      description: ""
      default: 0
    per_host_delay_ms:
      type: number
      description: ""
      default: null
    scripts:
      type: array
      description: ""
      default: null
      format: resource-crawl_script
      items:
        type: object
        properties:
          id:
            type: string
            description: ""
            originalType: string
          version:
            type: number
            description: ""
          options:
            type: object
            description: ""
            format: resource-record
          phase:
            type: string
            description: ""
            enum:
              - preload
              - behavior
            originalType: enum
          sha256:
            type: string
            description: ""
            originalType: string
          source:
            type: string
            description: ""
            originalType: string
      originalType: record[]
    signing:
      type: boolean
      description: ""
      default: null
    urls:
      type: array
      description: ""
      default: null
      items:
        type: string
      originalType: string[]
  required:
    - crawl_id
    - host
    - urls
    - per_host_delay_ms
    - capture_formats
    - signing
    - scripts
