summary: 1 ホストぶんを逐次で取り込む
description: |
  クロール 1 段を回す flow (f/waggle/crawl_level) の部品。
  単体で叩くものではない。
lock: "!inline f/waggle/crawl_host.script.lock"
kind: script
schema:
  properties:
    crawl_id:
      type: string
      description: ""
      default: null
      originalType: string
    host:
      type: string
      description: ""
      default: null
      originalType: string
    initial_delay_ms:
      type: integer
      description: ""
      default: 0
    per_host_delay_ms:
      type: number
      description: ""
      default: null
    capture_formats:
      type: object
      description: ""
      default: null
      properties:
        png:
          type: boolean
        webp:
          type: boolean
        html:
          type: boolean
        links:
          type: boolean
        mhtml:
          type: boolean
        wacz:
          type: boolean
    signing:
      type: boolean
      description: ""
      default: null
    scripts:
      type: array
      description: ""
      default: null
      items:
        type: object
        properties:
          id:
            type: string
          version:
            type: integer
          phase:
            type: string
          source:
            type: string
          sha256:
            type: string
          options:
            type: object
      originalType: CrawlScript[]
    urls:
      type: array
      description: ""
      default: null
      items:
        type: string
      originalType: string[]
  required:
    - crawl_id
    - host
    - urls
    - per_host_delay_ms
    - capture_formats
    - signing
    - scripts
