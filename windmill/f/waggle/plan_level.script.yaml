summary: ホストで束ね、robots を見る
description: |
  クロール 1 段を回す flow (f/waggle/crawl_level) の部品。
  単体で叩くものではない。
lock: "!inline f/waggle/plan_level.script.lock"
kind: script
schema:
  properties:
    candidates:
      type: array
      description: ""
      default: null
      format: resource-candidate
      items:
        type: object
        properties:
          host:
            type: string
            description: ""
            originalType: string
          lastFinishedAt:
            type: string
            description: ""
            originalType: string
          url:
            type: string
            description: ""
            originalType: string
      originalType: record[]
    depth:
      type: number
      description: ""
      default: null
    host_parallelism:
      type: number
      description: ""
      default: null
    per_host_delay_ms:
      type: number
      description: ""
      default: null
    respect_robots:
      type: boolean
      description: ""
      default: true
    robots_exemptions:
      type: array
      description: ""
      default: null
      format: resource-robots_exemption
      items:
        type: object
        properties:
          id:
            type: string
            description: ""
            originalType: string
          declaration:
            type: object
            description: ""
            format: resource-robots_declaration
            properties:
              exemptionId:
                type: string
                description: ""
                originalType: string
              expiresAt:
                type: string
                description: ""
                originalType: string
              grantedAt:
                type: string
                description: ""
                originalType: string
              grantedBy:
                type: string
                description: ""
                originalType: string
              pathPattern:
                type: string
                description: ""
                originalType: string
              reason:
                type: string
                description: ""
                originalType: string
              scope:
                type: string
                description: ""
                enum:
                  - seeds
                  - links
                originalType: enum
          host:
            type: string
            description: ""
            originalType: string
          pathPattern:
            type: string
            description: ""
            originalType: string
          remaining:
            type: number
            description: ""
          scope:
            type: string
            description: ""
            enum:
              - seeds
              - links
            originalType: enum
          userAgent:
            type: string
            description: ""
            originalType: string
      originalType: record[]
    user_agent:
      type: string
      description: ""
      default: null
      originalType: string
  required:
    - candidates
    - per_host_delay_ms
