summary: ホストで束ね、robots を見る
description: |
  クロール 1 段を回す flow (f/waggle/crawl_level) の部品。
  単体で叩くものではない。
lock: "!inline f/waggle/plan_level.script.lock"
kind: script
schema:
  properties:
    candidates:
      type: array
      description: ""
      default: null
      format: resource-candidate
      items:
        type: object
        properties:
          host:
            type: string
            description: ""
            originalType: string
          lastFinishedAt:
            type: string
            description: ""
            originalType: string
          url:
            type: string
            description: ""
            originalType: string
      originalType: record[]
    per_host_delay_ms:
      type: number
      description: ""
      default: null
    respect_robots:
      type: boolean
      description: ""
      default: true
    host_parallelism:
      type: integer
      description: ""
      default: null
    user_agent:
      type: string
      description: ""
      default: null
      originalType: string
  required:
    - candidates
    - per_host_delay_ms
