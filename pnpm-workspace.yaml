# docs-site も同じ workspace に入れる。lockfile を 1 本にしておかないと、
# 「root は pnpm、docs-site は npm」という状態が残り、install が 2 回要る
# (capture-fixtures がその形。capture-ledger はこちら)。
packages:
  - "docs-site"

# pnpm 11 は依存の lifecycle script を既定で実行しない。ここに挙がっているのは
# 「実行してよいか」を pnpm に聞かれたパッケージ。
#
#   esbuild — windmill-cli 経由。bin/esbuild は @esbuild/<platform> を **実行時に**
#             解決する Node のシムで、platform パッケージは optional dependency
#             として postinstall と無関係に入る。だから false でも動く
#             (capture-ledger で実測済み —— あちらの pnpm-workspace.yaml に同じ記録がある)。
#   protobufjs — @grpc/grpc-js 経由。postinstall は依存の版の書き方について stderr に
#             助言を書くだけで、ファイルを 1 つも作らない (capture-ledger が実物を読んで確認済み)。
#   puppeteer — docs のスクリーンショット撮影 (scripts/docs-shots.mjs) にしか使わない。
#             false にして Chromium を install 時に取りに行かせない (CI で 150MB を
#             毎回 DL しない)。撮る人は初回だけ手で `puppeteer browsers install chrome`。
#             .npmrc の PUPPETEER_SKIP_DOWNLOAD も同じ意図の二重の保険。
allowBuilds:
  esbuild: false
  protobufjs: false
  puppeteer: false

# windmill-cli は server と同じ版を追う (ほぼ毎日出る)。新しさを理由に
# 止められると、server の版を上げるたびに手が要る。
minimumReleaseAgeExclude:
  - windmill-cli@1.806.0
  - windmill-client@1.806.0

# 既知の脆弱性を lockfile から除くための上書き。lockfile を進めない上書きは効かないので、
# 足したら `pnpm why <pkg>` で版が動いたことを見ること。
#
#   windmill-cli>esbuild@0.28.0 — windmill-cli は esbuild を **0.28.0 ちょうど**に固定して
#             いる (1.806.0 から、2026-09-13 時点の最新 1.811.0 まで同じ)。0.28.0 には
#             GHSA-g7r4-m6w7-qqqr がある (Windows で esbuild の開発サーバを動かすと任意の
#             ファイルを読まれる。0.28.1 で修正)。この repo はその経路を通らないが、固定の
#             せいで lockfile の更新では上がらず、audit が赤いまま残る。0.28 の中の patch
#             なので互換は崩れない (windmill-cli の側から require して、変換と bundle が
#             通ることを確かめた)。
#
#             キーは 2 つの条件で絞ってある。`windmill-cli>` があるので、astro と vite の
#             esbuild には触らない (あちらは ^0.28.0 で求めるので lockfile の更新だけで上がる)。
#             `@0.28.0` は「求める範囲が 0.28.0 と重なるとき」だけ効くので、windmill-cli が
#             固定を動かせばこの行は何にも効かなくなり、後の版を 0.28 へ引き戻すことは無い。
#             **効かなくなっても pnpm は何も言わない** (2026-09-13 に確かめた)。windmill-cli を
#             上げるときに `npm view windmill-cli@<版> dependencies.esbuild` を見て、0.28.0 で
#             なければこの行を消す。
overrides:
  "windmill-cli>esbuild@0.28.0": "^0.28.1"
