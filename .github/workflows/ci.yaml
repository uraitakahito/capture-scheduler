name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # 版は .nvmrc 1 か所。docs.yaml と site.yaml も同じものを読む ——
          # 直書きすると写しが増え、育つのは片方だけになる。
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ステップを個別に並べているのは、どれが落ちたかを GitHub の UI で
      # 一目で分かるようにするため。`pnpm run check` を 1 行で呼ぶと、
      # 最初に落ちた 1 つの後ろが全部見えなくなる。
      #
      # **並べる以上、package.json の `check` と二重に書くことになる。** 片方だけ
      # 直すと片側でしか走らない検査ができるので、一致は下の check:ci-parity が
      # 機械で禁じる —— 顔ぶれ・並び・script でない step の 3 つを見る。
      - name: Format check
        run: pnpm run format:check

      - name: Env check
        run: pnpm run check-env

      # script は Windmill の worker (bun) が動かすので、ここでは型だけ見る。
      #
      # **設定を写さない。** 以前ここには tsc の引数が直書きされていて、
      # package.json 側が 5 本を見るようになった後も CI は trigger_run.ts 1 本しか
      # 見ていなかった (--skipLibCheck の有無も食い違っていた)。写しが 2 つあると、
      # 育つのは片方だけになる。tsconfig.json が唯一の設定。
      - name: Typecheck
        run: pnpm run typecheck

      # 単体だけ。e2e は Windmill・capture-ledger・browserhive・capture-fixtures が要るので
      # ここでは走らせない (pnpm run test:e2e を手で)。
      - name: Test
        run: pnpm test

      # compose が壊れていないこと。container-compose は CI に無いので、
      # YAML として読めることだけを見る。
      - name: CI と check の一覧が一致しているか
        run: pnpm run check:ci-parity

      - name: Parse docker-compose.yml
        run: node -e "const {parse}=require('yaml');const fs=require('fs');const d=parse(fs.readFileSync('docker-compose.yml','utf8'));if(d.name!=='capture-scheduler')throw new Error('project 名が capture-scheduler でない');if(!d.services.windmill)throw new Error('windmill サービスが無い');console.log('ok:',Object.keys(d.services).join(', '))"
